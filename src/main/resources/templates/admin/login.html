<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Jairo & Jennifer</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <div class="login-photo">
                <img
                    th:src="@{/images/login/login-jairo-jennifer.webp}"
                    alt="Jairo y Jennifer"
                >
                <div class="login-photo-overlay"></div>
                <div class="login-photo-brand">
                    <span class="login-monogram">
                        J <span>&</span> J
                    </span>
                    <p>Jairo & Jennifer</p>
                </div>
            </div>

            <div class="login-content">
                <header class="login-header">
                    <p class="login-kicker">
                        Administración
                    </p>
                    <h1>
                        Panel Administrador
                    </h1>
                    <p class="login-description">
                        Acceso privado para la gestión de la boda.
                    </p>
                </header>

                <form
                    class="login-form"
                    method="post"
                    action="/admin/login"
                >
                    <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                    >
                    <div class="form-group">
                        <label for="username">
                            Usuario
                        </label>
                        <div class="input-wrapper">
                            <span class="input-icon-wrapper">
                                <img
                                    th:src="@{/images/icons/log-in.svg}"
                                    alt=""
                                    class="input-icon"
                                >
                            </span>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">
                            Contraseña
                        </label>

                        <div class="input-wrapper">
                            <span class="input-icon-wrapper">
                                <img
                                    th:src="@{/images/icons/password.svg}"
                                    alt=""
                                    class="input-icon"
                                >
                            </span>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                autocomplete="current-password"
                                required
                            >
                        </div>
                    </div>

                    <div
                        class="login-message login-error"
                        th:if="${param.error}"
                    >
                        <p>
                            Usuario o contraseña incorrectos
                        </p>
                    </div>

                    <div class="login-message login-success" th:if="${param.logout}">
                        <p>
                            Sesión cerrada correctamente
                        </p>
                    </div>

                    <div class="form-submit">
                        <button type="submit">
                            Iniciar sesión
                        </button>
                    </div>
                </form>

                <div class="login-footer">
                    <span></span>
                    <p>
                        J & J
                    </p>
                    <span></span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
